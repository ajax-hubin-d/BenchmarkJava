name: SpotBugs + find-sec-bugs

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Check latest releases before running:
  # https://github.com/spotbugs/spotbugs/releases
  # https://central.sonatype.com/artifact/com.h3xstream.findsecbugs/findsecbugs-plugin
  SPOTBUGS_VERSION: 4.9.8
  FINDSECBUGS_VERSION: 1.14.0

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and export classpath
        run: |
          mvn -B -q -DskipTests compile
          mvn -B -q dependency:build-classpath -Dmdep.outputFile=cp.txt

      - name: Download SpotBugs and find-sec-bugs
        run: |
          curl -sSL -o spotbugs.tgz \
            "https://github.com/spotbugs/spotbugs/releases/download/${SPOTBUGS_VERSION}/spotbugs-${SPOTBUGS_VERSION}.tgz"
          tar xzf spotbugs.tgz
          curl -sSL -o findsecbugs.jar \
            "https://repo1.maven.org/maven2/com/h3xstream/findsecbugs/findsecbugs-plugin/${FINDSECBUGS_VERSION}/findsecbugs-plugin-${FINDSECBUGS_VERSION}.jar"

      - name: SpotBugs scan
        run: |
          time ./spotbugs-${SPOTBUGS_VERSION}/bin/spotbugs -textui \
            -pluginList findsecbugs.jar \
            -effort:max -low \
            -auxclasspath "$(cat cp.txt)" \
            -sarif=spotbugs.sarif \
            target/classes

      - uses: actions/upload-artifact@v4
        with:
          name: spotbugs-sarif
          path: spotbugs.sarif
