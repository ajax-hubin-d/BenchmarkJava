name: Semgrep

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        run: |
          semgrep --version
          semgrep scan \
            --config p/java \
            --config p/security-audit \
            --metrics=off \
            --sarif --output semgrep.sarif \
            --time
        # Semgrep exits 0 even with findings unless --error is set

      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
